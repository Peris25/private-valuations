{% extends "base.html" %}
{% block title %}Preview & Confirm{% endblock %}
{% block content %}

<h2 class="mb-4">Confirm Your Vehicle Details</h2>

<form method="POST" action="/preview" id="locationForm">
  <div class="card shadow-sm p-4">
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ user.category }}" readonly>
      </div>

      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" name="firstName" class="form-control" value="{{ user.firstName }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" name="lastName" class="form-control" value="{{ user.lastName }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Make</label>
        <input type="text" name="make" class="form-control" value="{{ user.make }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Model</label>
        <input type="text" name="model" class="form-control" value="{{ user.model }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Body Type</label>
        <input type="text" name="bodyType" class="form-control" value="{{ user.bodyType }}" readonly>
      </div>

      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ user.phone or '254' }}" pattern="254\d{9}" title="Format: 2547XXXXXXXX" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Price (KES)</label>
        <input type="text" name="price" class="form-control" value="{{ user.price }}" readonly>
      </div>

      <div class="col-md-6">
        <label class="form-label">Registration Number</label>
        <input type="text" name="reg" class="form-control" value="{{ user.reg }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Search Your Location</label>
        <input id="location-search" name="location" type="text" class="form-control" placeholder="Search for your location..." autocomplete="off" required>
      </div>

      <input type="hidden" name="latitude" id="lat">
      <input type="hidden" name="longitude" id="lng">

    </div>

    <div class="mt-4 text-center">
      <button type="submit" class="btn btn-success btn-lg">Proceed to Payment</button>
    </div>
  </div>
</form>

<script>
  let autocomplete;

  function initAutocomplete() {
    const input = document.getElementById("location-search");
    autocomplete = new google.maps.places.Autocomplete(input);

    autocomplete.addListener("place_changed", function () {
      const place = autocomplete.getPlace();
      if (place.geometry) {
        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();
        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;
        console.log("📍 Location selected:", lat, lng);
      } else {
        alert("Please select a location from the dropdown.");
      }
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    initAutocomplete();

    document.getElementById("locationForm").addEventListener("submit", function (e) {
      const lat = document.getElementById("lat").value;
      const lng = document.getElementById("lng").value;
      if (!lat || !lng) {
        e.preventDefault();
        alert("⚠️ Please select a location from the dropdown.");
        document.getElementById("location-search").classList.add("is-invalid");
      }
    });
  });
</script>

<script src="https://maps.googleapis.com/maps/api/js?key={{ geoplaces_api_key }}&libraries=places"></script>

{% endblock %}
