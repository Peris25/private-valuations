{% extends "base.html" %}
{% block title %}Upload Logbook{% endblock %}
{% block content %}

<h2 class="mb-4 text-center" style="color: navy;">Private Valuation Request</h2>

<form method="POST" enctype="multipart/form-data" class="card shadow-sm p-4" style="max-width: 600px; margin: auto;">
  <div class="mb-3">
    <label class="form-label">First Name</label>
    <input name="firstName" type="text" class="form-control" placeholder="First Name" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Last Name</label>
    <input name="lastName" type="text" class="form-control" placeholder="Last Name" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input name="email" type="email" class="form-control" placeholder="example@domain.com" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input name="phone" type="text" class="form-control" placeholder="2547XXXXXXXX" pattern="254\d{9}" title="Use format 2547XXXXXXXX" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Upload Logbook (Image)</label>
    <input type="file" name="logbook" class="form-control" accept="image/*, application/pdf" required>
  </div>

  <div class="text-center mt-4">
    <button type="submit" class="btn btn-danger btn-lg">Upload</button>
  </div>
</form>

{% endblock %}
